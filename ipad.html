<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPad Touch & Play Hub - Mr. Savold</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f172a;
            overflow: hidden; /* Guaranteed zero scrolling */
        }

        .ipad-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 12px;
            gap: 12px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e293b;
            color: white;
            padding: 8px 20px;
            border-radius: 14px;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .home-btn {
            background-color: #475569;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .home-btn:active {
            background-color: #64748b;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 10px;
            flex: 1;
        }

        .touch-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: white;
            text-decoration: none;
            border-radius: 18px;
            font-size: 1.4rem;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            transition: transform 0.1s ease, filter 0.1s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            padding: 8px 14px;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.4);
        }

        .touch-btn:active {
            transform: scale(0.96);
            filter: brightness(1.15);
        }

        /* High-contrast ROYGBIV Spectrum */
        .touch-btn.red { background-color: #e74c3c; }
        .touch-btn.orange { background-color: #e67e22; }
        .touch-btn.yellow { background-color: #f1c40f; color: #1e293b; text-shadow: none; }
        .touch-btn.green { background-color: #2ecc71; }
        .touch-btn.teal { background-color: #1abc9c; }
        .touch-btn.blue { background-color: #3498db; }
        .touch-btn.indigo { background-color: #3f51b5; }
        .touch-btn.violet { background-color: #9b59b6; }

        .btn-icon {
            font-size: 2.2rem;
        }

        @media (max-aspect-ratio: 1/1) {
            .touch-btn {
                font-size: 1.2rem;
                flex-direction: column;
                gap: 4px;
            }
            .btn-icon {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="ipad-container">
        <header>
            <h1>📱 Touch & Play Hub (10 Activities)</h1>
            <a href="index.html" class="home-btn">🏠 Main Site</a>
        </header>

        <div class="grid-layout">
            <!-- 1. Creatability Sound Canvas (Georgios' favorite) -->
            <a href="https://creatability.withgoogle.com/sound-canvas/" target="_blank" class="touch-btn red">
                <span class="btn-icon">🎨</span>
                <span>Sound Canvas</span>
            </a>

            <!-- 2. Splash Canvas -->
            <a href="https://artsandculture.google.com/experiment/splash-canvas/vQFCtQB7FDnYkA" target="_blank" class="touch-btn orange">
                <span class="btn-icon">🖌️</span>
                <span>Splash Canvas</span>
            </a>

            <!-- 3. Blob Opera -->
            <a href="[suspicious link removed]" target="_blank" class="touch-btn yellow">
                <span class="btn-icon">🎤</span>
                <span>Blob Opera</span>
            </a>

            <!-- 4. Creatability Seeing Music -->
            <a href="[suspicious link removed]" target="_blank" class="touch-btn green">
                <span class="btn-icon">👁️</span>
                <span>Seeing Music</span>
            </a>

            <!-- 5. Chrome Music Lab -->
            <a href="https://musiclab.chromeexperiments.com/" target="_blank" class="touch-btn teal">
                <span class="btn-icon">🎵</span>
                <span>Music Lab</span>
            </a>

            <!-- 6. Virtual Piano -->
            <a href="https://www.onlinepianist.com/virtual-piano" target="_blank" class="touch-btn blue">
                <span class="btn-icon">🎹</span>
                <span>Virtual Piano</span>
            </a>

            <!-- 7. PBS Kids Games -->
            <a href="https://pbskids.org/games" target="_blank" class="touch-btn indigo">
                <span class="btn-icon">🎬</span>
                <span>PBS Kids</span>
            </a>

            <!-- 8. Explore.org Live Cams -->
            <a href="https://explore.org/livecams" target="_blank" class="touch-btn violet">
                <span class="btn-icon">🐶</span>
                <span>Animal Cams</span>
            </a>

            <!-- 9. 3D Dinosaurs -->
            <a href="https://artsandculture.google.com/search?q=dinosaurs" target="_blank" class="touch-btn red">
                <span class="btn-icon">🦖</span>
                <span>3D Dinosaurs</span>
            </a>

            <!-- 10. ABCya Touch Games -->
            <a href="https://abcya.com/" target="_blank" class="touch-btn orange">
                <span class="btn-icon">🧩</span>
                <span>ABCya Games</span>
            </a>
        </div>
    </div>

</body>
</html>
