<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPad Touch & Play Hub - Mr. Savold</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f172a; /* Dark background keeps focus on the bright buttons */
            overflow: hidden; /* Guarantees no scrolling */
        }

        .ipad-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 16px;
            gap: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 16px;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        .home-btn {
            background-color: #475569;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .home-btn:active {
            background-color: #64748b;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 16px;
            flex: 1;
        }

        .touch-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: white;
            text-decoration: none;
            border-radius: 24px;
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            transition: transform 0.1s ease, filter 0.1s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            padding: 12px 20px;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.4);
        }

        .touch-btn:active {
            transform: scale(0.95);
            filter: brightness(1.15);
        }

        /* High-contrast ROYGBIV Colors */
        .touch-btn.red { background-color: #e74c3c; }
        .touch-btn.orange { background-color: #e67e22; }
        .touch-btn.yellow { background-color: #f1c40f; color: #1e293b; text-shadow: none; }
        .touch-btn.green { background-color: #2ecc71; }
        .touch-btn.blue { background-color: #3498db; }
        .touch-btn.violet { background-color: #9b59b6; }

        .btn-icon {
            font-size: 3rem;
        }

        /* Automatic spacing adjustment for portrait orientation */
        @media (max-aspect-ratio: 1/1) {
            .touch-btn {
                font-size: 1.5rem;
                flex-direction: column;
                gap: 8px;
            }
            .btn-icon {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="ipad-container">
        <header>
            <h1>📱 Touch & Play Hub</h1>
            <a href="index.html" class="home-btn">🏠 Main Site</a>
        </header>

        <div class="grid-layout">
            <!-- 1. Splash Canvas -->
            <a href="[suspicious link removed]" target="_blank" class="touch-btn red">
                <span class="btn-icon">🎨</span>
                <span>Splash Canvas</span>
            </a>

            <!-- 2. Chrome Music Lab -->
            <a href="[suspicious link removed]" target="_blank" class="touch-btn orange">
                <span class="btn-icon">🎵</span>
                <span>Music Lab</span>
            </a>

            <!-- 3. Virtual Piano -->
            <a href="[suspicious link removed]" target="_blank" class="touch-btn violet">
                <span class="btn-icon">🎹</span>
                <span>Virtual Piano</span>
            </a>

            <!-- 4. PBS Kids Games -->
            <a href="[suspicious link removed]" target="_blank" class="touch-btn green">
                <span class="btn-icon">🎬</span>
                <span>PBS Kids</span>
            </a>

            <!-- 5. Animal Cams -->
            <a href="[suspicious link removed]" target="_blank" class="touch-btn blue">
                <span class="btn-icon">🐶</span>
                <span>Animal Cams</span>
            </a>

            <!-- 6. 3D Dinosaurs -->
            <a href="[suspicious link removed]" target="_blank" class="touch-btn yellow">
                <span class="btn-icon">🦖</span>
                <span>3D Dinosaurs</span>
            </a>
        </div>
    </div>

</body>
</html>
