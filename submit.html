<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send a Message - Mr. Savold's Class</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        h1 { margin: 0; font-size: 2rem; }

        .back-btn {
            display: inline-block;
            background-color: #f1c40f;
            color: #2c3e50;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            transition: transform 0.1s ease;
        }

        .back-btn:hover, .back-btn:focus {
            transform: translateY(-2px);
            outline: 3px solid #2c3e50;
        }

        .form-container {
            background-color: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        iframe {
            width: 100%;
            height: 700px;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Computer Science with Mr. Savold</h1>
    </header>

    <a href="index.html" class="back-btn">🏠 Back to Main Portal</a>

    <div class="form-container">
        <h2>✍️ Type Your Message Below</h2>
        <!-- Replace YOUR_GOOGLE_FORM_EMBED_URL_HERE with actual Google Form embed link -->
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSc_EXAMPLE/viewform?embedded=true">Loading form…</iframe>
    </div>

</body>
</html>
