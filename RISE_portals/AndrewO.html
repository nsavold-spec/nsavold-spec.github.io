<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrew's Student Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            color: #2c3e50;
        }

        header {
            text-align: center;
            background-color: #2c3e50;
            color: white;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
            font-size: 2.2rem;
        }

        .card {
            background-color: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            line-height: 1.6;
            font-size: 1.1rem;
        }

        .credential-box {
            background-color: #eef2f5;
            border-left: 5px solid #3498db;
            padding: 16px;
            margin: 15px 0;
            border-radius: 6px;
            font-size: 1.15rem;
        }

        .credential-box code {
            background-color: #ffffff;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-family: monospace;
            font-weight: bold;
            color: #d35400;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .link-btn {
            display: block;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            color: #ffffff;
            transition: background-color 0.2s ease;
        }

        .blue { background-color: #3498db; }
        .blue:hover { background-color: #2980b9; }

        .green { background-color: #2ecc71; }
        .green:hover { background-color: #27ae60; }
    </style>
</head>
<body>

    <header>
        <h1>👋 Welcome, Andrew!</h1>
    </header>

    <div class="card">
        <h2>ℹ️ Information for Aides, Teachers, & Parents</h2>
        <p>Please use the credentials below to log Andrew into his typing programs and learning websites:</p>

        <div class="credential-box">
            <strong>Username / Email:</strong> <code>nichsavo+andrew@gmail.com</code><br><br>
            <strong>Password:</strong> <code>Andrew123</code>
        </div>

        <div class="btn-group">
            <a href="https://edclub.com/typingclub" target="_blank" rel="noopener noreferrer" class="link-btn green">⌨️ Open Typing Club</a>
            <a href="https://nsavold-spec.github.io/" class="link-btn blue">🏠 Return to Main Homepage</a>
        </div>
    </div>

</body>
</html>
