<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Mr. Savold | Class Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { margin: 0; font-size: 1.8rem; }

        .home-btn {
            background-color: #f1c40f;
            color: #2c3e50;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            color: #2c3e50;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-size: 1.1rem;
            box-sizing: border-box;
        }

        .submit-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .submit-btn:hover { background-color: #27ae60; }
    </style>
</head>
<body>

    <header>
        <h1>✍️ Message Mr. Savold</h1>
        <a href="index.html" class="home-btn">🏠 Main Portal</a>
    </header>

    <div class="card">
        <form action="https://formspree.io/f/sample" method="POST">
            <div class="form-group">
                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name" required placeholder="Type your name here...">
            </div>

            <div class="form-group">
                <label for="message">Your Message or Answer:</label>
                <textarea id="message" name="message" rows="5" required placeholder="Type your message to Mr. Savold here..."></textarea>
            </div>

            <button type="submit" class="submit-btn">🚀 Send Message</button>
        </form>
    </div>

</body>
</html>
